[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionkit"
version = "0.1.0"
description = "A library of object tracking algorithms and activation functions, implemented from scratch."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]